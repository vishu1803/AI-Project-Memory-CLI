name: CD

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release-artifact:
    name: Build release artifact
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ai memory

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ai memory/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Create package tarball
        run: npm pack

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-memory-package-${{ github.ref_name }}
          path: ai memory/*.tgz

  publish-npm:
    name: Publish to npm
    needs: release-artifact
    runs-on: ubuntu-latest
    if: ${{ secrets.NPM_TOKEN != '' }}

    defaults:
      run:
        working-directory: ai memory

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js for npm publish
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm
          cache-dependency-path: ai memory/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
